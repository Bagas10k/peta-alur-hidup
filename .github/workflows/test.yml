name: Test skill
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python skills/peta-alur-hidup/scripts/render.py examples/pengajuan/model.json --root examples/pengajuan --output examples/pengajuan/ALUR.md --check
